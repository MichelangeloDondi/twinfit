# The description of his 8 recorded traces of one peak, as a researcher writes it for the package (his message 140): the
# data collection and the physical problem, and the optional addenda. It names no term of the model of this repository.
# Read by twinfit.description.read. Written 2026-10-14.

[problem]
name = "one hyperfine peak of the two photon line of rubidium from 5S to 6S, at 993.4192 nm"
what = "A heated vapour cell of rubidium, crossed by one laser beam near 993.4 nm whose frequency is scanned across one hyperfine peak of the two photon transition from 5S to 6S. Each trace is the signal of the transition against the frequency of the laser, within 25 MHz of the top of the line. The traces were taken at four temperatures of the cell at one power, and at five powers at one temperature, the two sweeps sharing one trace. The beam has one radius at the atoms in every trace."
abscissa = "frequency from the top of the line"
abscissa_unit = "MHz"
value = "signal"
value_unit = "V"

[covariates.temperature]
unit = "C"

[covariates.power]
unit = "mW"

[covariates.waist]
unit = "um"

[[trace]]
file = "../data/recorded/993.4192/trace_P225mW_T070C.csv"
temperature = 70
power = 225
waist = 43.0

[[trace]]
file = "../data/recorded/993.4192/trace_P225mW_T090C.csv"
temperature = 90
power = 225
waist = 43.0

[[trace]]
file = "../data/recorded/993.4192/trace_P225mW_T110C.csv"
temperature = 110
power = 225
waist = 43.0

[[trace]]
file = "../data/recorded/993.4192/trace_P225mW_T130C.csv"
temperature = 130
power = 225
waist = 43.0

[[trace]]
file = "../data/recorded/993.4192/trace_P175mW_T130C.csv"
temperature = 130
power = 175
waist = 43.0

[[trace]]
file = "../data/recorded/993.4192/trace_P125mW_T130C.csv"
temperature = 130
power = 125
waist = 43.0

[[trace]]
file = "../data/recorded/993.4192/trace_P075mW_T130C.csv"
temperature = 130
power = 75
waist = 43.0

[[trace]]
file = "../data/recorded/993.4192/trace_P025mW_T130C.csv"
temperature = 130
power = 25
waist = 43.0

# The setup of the data collection, row M216 and his message 184, as the analysis repository records it: read on
# 2026-10-16 into reviews/SETUP_RECORD_184.md, with the file and line of each item. The package reads no physics here.

[setup.oscilloscope]
words = "an Agilent InfiniiVision DSO-X 3054A, 2000 points a trace over 1.000 s, in its mode of high resolution, 11.86 bits in the saved files, its vertical range changed at every power and not recorded"
known = "set"

[setup.photomultiplier]
words = "a Hamamatsu R636-10 photomultiplier in a Thorlabs PXT1/M housing, whose gain and high voltage are not in the record"
known = "not recorded"

[setup.preamplifier]
words = "the preamplifier after the photomultiplier, of a gain in volts for each ampere"
value = 1e6
unit = "V/A"
known = "set"

[setup.scan]
words = "a triangular scan of the cavity of the laser, one side a trace, 85.2 MHz of the transition a trace"
value = 0.085049
uncertainty = 0.00010
unit = "MHz of the transition for each ms"
known = "measured"

[setup.peaks]
words = "one hyperfine peak a trace: the four sit at 0, 911.3, 3220.0 and 5225.0 MHz of the transition"
known = "set"

[setup.retroreflection]
words = "a flat mirror that returns the beam through the cell, for an excitation free of Doppler: its efficiency at the atoms"
value = 0.94
uncertainty = 0.04
unit = "1"
known = "assumed"

[setup.beam_radius]
words = "the radius of the beam at its waist, at the atoms, his ansatz"
value = 43.0
uncertainty = 1.0
unit = "um"
known = "assumed"

[setup.m_squared]
words = "the M squared of the beam, its quality against a Gaussian beam"
known = "not recorded"

[setup.aperture]
words = "the clear aperture of the electro-optic modulator, which can clip the beam"
value = 3.0
unit = "mm"
known = "from its maker"

[setup.temperature]
words = "the temperature of the cell, read by thermocouples on a copper block, with no measured stability in the record"
known = "measured"

[setup.power]
words = "the power of the beam, read after the modulator, to 0.5 per cent by the figure of its driver"
known = "measured"

[noise]
from = "neighbours"

[addenda.ansatz.waist]          # his value, message 133: "For the waist use always w_0 = 43 +-1 um"
value = 43.0
uncertainty = 1.0

# The levers of the experiment, from his message 142, each as it enters the twin of the package. The words are the
# researcher's: the package reads only the kind, the factor and the values.

[addenda.lever.repetitions]
kind = "repeats"
factor = 5
words = "five repetitions of each condition, as the experiment takes them, where one alone is read here"

[addenda.lever.gain]
kind = "noise"
factor = 0.5
words = "a higher gain of the photomultiplier, or another oscilloscope, which halves the noise of each sample"

[addenda.lever.slower]
kind = "samples"
factor = 2.0
words = "a scan twice as slow, with twice the samples over the same span"

[addenda.lever.wider]
kind = "span"
factor = 2.0
words = "a scan of twice the span about the top of the line"

[addenda.lever.hotter]
kind = "covariate"
covariate = "temperature"
values = [150]
at = { power = 225 }
words = "one more temperature of the cell, 150 C, at 225 mW"

[addenda.lever.waist]
kind = "covariate"
covariate = "waist"
values = [35.0, 51.0]
at = { temperature = 130, power = 225 }
words = "two more radii of the beam at the atoms, 35 and 51 um, at 130 C and 225 mW"

[addenda.lever.stronger]          # his message 172: "going to higher powers"
kind = "covariate"
covariate = "power"
values = [300]
at = { temperature = 130 }
words = "one more power of the laser, 300 mW, at 130 C"

[addenda.lever.beam]          # his message 172: "a better characterization of the setup (like the beam size"
kind = "characterization"
of = "waist"
factor = 0.5
words = "the radius of the beam at the atoms measured by a knife edge or a camera, to half its uncertainty"

[addenda.lever.m_squared]          # his message 172, "the M squared of the beam": a lever of the setup, which no value of the toy reads before its detail
kind = "setup"
of = "m_squared"
words = "the M squared of the beam measured with a camera along the focus"

[addenda.lever.retroreflection]          # his message 172, "the efficiency of the retro reflection"
kind = "setup"
of = "retroreflection"
words = "the efficiency of the retro reflection measured with a pick-off"

[addenda.lever.photomultiplier]          # the record, reviews/SETUP_RECORD_184.md: the gain of the photomultiplier is not recorded
kind = "setup"
of = "photomultiplier"
words = "the gain and the high voltage of the photomultiplier recorded at each power"

# His ways to a better experiment of message 172 that no lever of the package draws on this toy, each with why:
#   a steadier temperature, power or frequency: the twin draws each condition at its stated value, and a lever of
#     stabilization needs a drift of the condition in the model, which no detail of the toy holds
#   the M squared of the beam and the efficiency of the retro reflection: levers of the setup above, named by the
#     package and measured on the twin once a detail after the fifth reads them
#   all four hyperfine peaks in the same trace: the toy models one peak, and a record of four is a model of four lines
#   a sweep of the retro reflection efficiency: as its characterization, it waits for its detail
