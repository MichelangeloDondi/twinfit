# The thresholds of 0.1.0, written 2026-10-23 at 03:06, before any count at 0.1.0rc15: drafts that are his to change,
# from the twelve criteria of the red team of his message 331, reviews/REDTEAM_331.md. tools/met.py reads a table of the
# counting copy against them, and a row of section B of PLAN.md is met when every criterion that names it is met. A
# share is met where it lies at or above `at_least`, at or under `at_most`, or within `errors` standard errors of its draws
# about `around`. A table
# made at another version than `release` meets nothing, and a criterion with no bound meets nothing. A reading on fewer
# draws than `min_of`, the draws that its count asks less a tenth, is not counted: a parameter that the table does not
# score, or draws that failed, leave it short (review 92, moderates 1 and 9).
# Each criterion has a mode, "default", the package blind, with no dictionary (his messages 337 and 340). A table names
# its mode, a table that names none was counted with the dictionary on, and a table of another mode meets nothing. The
# criteria of the dictionary, C3 and C8, were taken out on his message 340, which asks no count of a dictionary.

# Written again 2026-10-24 at 02:05 on his message 352, which left them to the session. C6, C7 and C10 were set again at
# 03:40 and 04:44 on reviews 98 and 99, after review 98 had named shares of the loop count on its progress log, and
# C2's min_of moved from 30 to 36 after tables of the bench were on disk. C7 was set again at 12:49 and 14:10 on
# reviews 103 and 104, after the tables of 0.1.0rc16 were read: its band follows the draws of each reading. C5c was
# added on 2026-10-27, its 0.12 that of C5, set from 30 sets with its reading of 0.188 beside it. So these
# thresholds are not blind to the tables, and the page says each reading with its draws. A threshold is set where a
# package that does what is asked passes on 95 cases of 100 at the count's own draws. A rate that a right package has
# by construction, a false alarm or a coverage, is its nominal value widened by two standard errors of the count's
# draws, and where several readings must hold together, by the standard errors that give 95 cases of 100 to all of
# them. A share of usefulness lies well above what chance gives. Not repaired: min_of = 18 of C6 and C7, at which
# the four bars of an arm pass together on 0.925, and C6's refused_at_least, fixed at any count of draws.

release = "0.1.0"          # moved from 0.1.0rc22 on 2026-10-28, 0.1.0 being the code of 0.1.0rc22 under its number, his message 430, its tables written again from the rows of that code in `~/twinfit-copies/r010`, no threshold changed. It moved from 0.1.0rc21 on 2026-10-26, its counts on the stamp of 0.1.0rc22, row M494, no threshold changed. It moved from 0.1.0rc20 on 2026-10-25, its counts on the stamp of 0.1.0rc21, row M490, no threshold changed. It moved from 0.1.0rc17 on 2026-10-25, its counts on the stamp of 0.1.0rc19, rows M485 and M486, no threshold changed. It moved from 0.1.0rc16 on 2026-10-24, its counts on the stamp of 0.1.0rc17, row M482 (review 103, moderate 2). It moved from 0.1.0rc15 on 2026-10-23, before any count at 0.1.0rc16: the package blind, his messages 337 and 340, moves the report

[C1]
row = "M456"
mode = "default"
what = "the place of each term of tiers 2 to 5, hidden at the size of the twin, put first by the report"
table = "pointing"
at_least = 0.60
min_of = 27

[C2]
