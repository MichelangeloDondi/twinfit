at_most = 0.12          # the twin of a case has 100 sets (toy/pointing.py): a new draw passes the 95th percentile of 100 sets on 0.059 by construction and of 30 sets on 0.076, two standard errors of 250 draws add 0.030, so 0.09 is the sum at 100 sets (runs/pages/c5_construction.py). The 0.12 was set from 30 sets and stands until your word. At 0.05 a right package fails
