[C5c]
row = "M505"
mode = "default"
what = "a right model read against the twin of its own fit at the loop's default of 30 sets, as a researcher runs it: some answer beyond the twin, the false alarm the default gives"
table = "pointing"
at_most = 0.12          # the line of C5, the level the package claims: 0.1.0rc22 reads 0.188 +- 0.025 of 250 at the default (RED_TEAM.md). Row M509 counted it: at 100 sets the same draws read 0.076 +- 0.017 of 250 (runs/reports/release-0.1.0rc22/OWN_100_SETS.md), under this line, so the default of sets is his decision 13 of PLAN.md. Whether another making of the twin of a draw's own fit does the same is a hypothesis with no count planned. The line of 0.12 was written on 2026-10-27 before any count of 0.1.1 and not moved after
