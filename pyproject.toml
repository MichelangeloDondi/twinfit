[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twinfit"
dynamic = ["version"]
description = "Where a model lacks a term: the structure of the residuals of a fit, read against its twin"
readme = "twinfit/README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["twinfit/LICENSE"]          # the licence as an expression alone: setuptools 77 refuses a licence classifier beside it (PEP 639), and the build of 0.0.7 failed on one, 2026-10-18
authors = [{name = "Michelangelo Dondi"}]
# THE FLOOR OF NUMPY IS A CHOICE, MEASURED ON ONE MACHINE, his messages 233 and 234. np.convolve, with which the term
# `widened` convolves each curve with its kernel, took 10.0 ms on numpy 1.26.4 and 0.80 ms on 2.5.2 for 9000 by 2001
# points, one thread on a Mac with an arm64 processor, 2026-10-18. On Linux with an x86_64 processor review 39 measured
# 1.74 ms on 1.26.4 and 2.11 ms on 2.5.0: the speed-up is the build of numpy on the Mac, not the call. numpy 2.5 is kept
# as the floor for the Mac and because the clean legs below ran on it. The rest follows: numpy 2.5 asks Python 3.12, and
# scipy before 1.16 refuses numpy 2.5. What the code calls asks less, tomllib Python 3.11, default_rng numpy 1.17 and
# voigt_profile scipy 1.4. Each floor is what a clean leg pins and runs: Python 3.12 with numpy 2.5.0 and scipy 1.16.0,
# beside Python 3.14 with numpy 2.5.2 and scipy 1.18.0, each running the five minutes of the README and the gallery.
dependencies = ["numpy>=2.5", "scipy>=1.16"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
]

[project.urls]
Source = "https://github.com/MichelangeloDondi/twinfit"
Documentation = "https://github.com/MichelangeloDondi/twinfit/blob/main/twinfit/CONTINUING.md"
Changelog = "https://github.com/MichelangeloDondi/twinfit/blob/main/twinfit/version.py"

[project.optional-dependencies]
log = ["matplotlib"]          # the visual log of a run, `python -m twinfit log DIR`, and the picture of the residuals of a report: no floor is stated, since none was measured

[project.scripts]
twinfit = "twinfit.__main__:entry"

[tool.setuptools]
packages = ["twinfit", "twinfit.examples", "twinfit.examples.projects"]

[tool.setuptools.package-data]
twinfit = ["agent/*.md", "agent/*.py", "agent/*.toml", "agent/skill/*.md", "TUTORIAL.md", "README.md", "EXAMPLES.md", "RUBIDIUM.md", "CONTINUING.md", "LICENSE", "examples/gallery.json", "examples/rubidium/*.png", "examples/rubidium_twin/*.toml", "examples/rubidium_twin/*.json", "examples/rubidium_twin/model.txt", "examples/rubidium_twin/traces/*.csv", "examples/figures/*.png"]

[tool.setuptools.dynamic]
version = {attr = "twinfit.version.__version__"}
