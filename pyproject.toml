[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twinfit"
dynamic = ["version"]
description = "Where a model lacks a term: the structure of the residuals of a fit, read against its twin"
readme = "twinfit/README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["twinfit/LICENSE"]          # the licence as an expression alone: setuptools 77 refuses a licence classifier beside it (PEP 639), and the build of 0.0.7 failed on one, 2026-10-18
authors = [{name = "Michelangelo Dondi"}]
# THE FLOOR IS DERIVED, NOT CHOSEN, as in the repository Rb-5S-6S-analysis, his messages 233 and 234. numpy 2.5 replaced
# np.convolve, with which the term `widened` convolves each curve with its kernel, and is about ten times faster on it:
# 9000 by 2001 points took 10.0 ms on numpy 1.26.4 and 0.80 ms on 2.5.2, one thread each on this Mac, 2026-10-18. So numpy
# 2.5 is the floor. The rest follows: numpy 2.5 asks Python 3.12, and scipy before 1.16 refuses numpy 2.5. What the code
# calls asks less, tomllib Python 3.11, default_rng numpy 1.17 and voigt_profile scipy 1.4, but a floor ten times slower is
# no fair promise. Each floor is what a clean leg pins and runs: Python 3.12 with numpy 2.5.0 and scipy 1.16.0, beside
# Python 3.14 with numpy 2.5.2 and scipy 1.18.0, each running the five minutes of the README and the whole gallery.
dependencies = ["numpy>=2.5", "scipy>=1.16"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
twinfit = "twinfit.__main__:entry"

[tool.setuptools]
packages = ["twinfit", "twinfit.examples", "twinfit.examples.projects"]

[tool.setuptools.package-data]
twinfit = ["agent/*.md", "agent/*.py", "agent/*.toml", "agent/skill/*.md", "TUTORIAL.md", "README.md", "EXAMPLES.md", "RUBIDIUM.md", "LICENSE", "examples/gallery.json", "examples/rubidium/*.png", "examples/figures/*.png"]

[tool.setuptools.dynamic]
version = {attr = "twinfit.version.__version__"}
